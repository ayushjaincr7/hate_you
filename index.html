<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Reef 🐠</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(55, 180, 220, .22),
            transparent 45%
        ),
        linear-gradient(
            to bottom,
            #031c32,
            #052e4b 42%,
            #031d34 72%,
            #010c18
        );

    color: white;

    font-family: Inter, sans-serif;
}

/* =========================================================
   OCEAN LIGHT
========================================================= */

.ocean-light {

    position: fixed;

    inset: -30%;

    pointer-events: none;

    background:
        conic-gradient(
            from 180deg,
            transparent,
            rgba(130,230,255,.07),
            transparent,
            rgba(130,230,255,.05),
            transparent
        );

    filter: blur(25px);

    animation:
        oceanMove 10s ease-in-out infinite alternate;

    z-index: 1;
}

@keyframes oceanMove {

    from {
        transform:
            translateX(-3%)
            rotate(-2deg);
    }

    to {
        transform:
            translateX(3%)
            rotate(2deg);
    }
}

/* =========================================================
   HEADER
========================================================= */

.header {

    position: fixed;

    top: 24px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 90%;

    text-align: center;

    z-index: 100;

    transition:
        opacity .7s ease;
}

.header h1 {

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(38px, 7vw, 64px);

    font-weight: 500;

    letter-spacing: .04em;

    text-shadow:
        0 0 15px rgba(255,255,255,.15),
        0 0 35px rgba(80,200,255,.2);
}

.header p {

    margin-top: 4px;

    font-size: 10px;

    letter-spacing: .18em;

    text-transform: uppercase;

    color:
        rgba(220,245,255,.55);
}

body.love-mode .header {
    opacity: .18;
}

/* =========================================================
   REEF
========================================================= */

#reef {

    position: fixed;

    inset: 0;

    overflow: hidden;

    z-index: 5;
}

/* =========================================================
   HINT
========================================================= */

.hint {

    position: fixed;

    bottom: 24px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 90%;

    text-align: center;

    color:
        rgba(220,245,255,.62);

    font-size: 10px;

    letter-spacing: .1em;

    z-index: 100;

    transition:
        opacity .6s ease,
        transform .6s ease;
}

.hint.hide {

    opacity: 0;

    transform:
        translateX(-50%)
        translateY(15px);
}

/* =========================================================
   BUBBLES
========================================================= */

.bubble {

    position: absolute;

    bottom: -30px;

    border:
        1px solid
        rgba(190,240,255,.3);

    border-radius: 50%;

    background:
        rgba(170,235,255,.04);

    animation:
        bubbleRise
        linear
        infinite;

    pointer-events: none;

    z-index: 2;
}

@keyframes bubbleRise {

    0% {

        transform:
            translateY(0)
            translateX(0);

        opacity: 0;
    }

    10% {
        opacity: .6;
    }

    50% {

        transform:
            translateY(-50vh)
            translateX(20px);
    }

    100% {

        transform:
            translateY(-115vh)
            translateX(-20px);

        opacity: 0;
    }
}

/* =========================================================
   PARTICLES
========================================================= */

.particle {

    position: absolute;

    width: 2px;

    height: 2px;

    border-radius: 50%;

    background:
        rgba(200,245,255,.5);

    box-shadow:
        0 0 6px
        rgba(150,230,255,.5);

    animation:
        particleFloat
        linear
        infinite;

    pointer-events: none;

    z-index: 3;
}

@keyframes particleFloat {

    from {

        transform:
            translateY(0);

        opacity: 0;
    }

    20% {
        opacity: .6;
    }

    to {

        transform:
            translateY(-90px);

        opacity: 0;
    }
}

/* =========================================================
   NORMAL FISH
========================================================= */

.fish {

    position: absolute;

    width: 60px;

    height: 38px;

    border: 0;

    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 20;

    transform-origin: center;

    filter:
        drop-shadow(
            0 4px 5px
            rgba(0,0,0,.18)
        );

    transition:
        opacity .8s ease;
}

.fish svg {

    width: 100%;

    height: 100%;

    overflow: visible;

    pointer-events: none;
}

.fish-name {

    position: absolute;

    left: 50%;

    top: -17px;

    transform:
        translateX(-50%)
        translateY(5px);

    white-space: nowrap;

    padding:
        3px 7px;

    border-radius: 20px;

    background:
        rgba(0,15,30,.75);

    border:
        1px solid
        rgba(180,230,255,.15);

    color:
        rgba(235,250,255,.8);

    font-size: 9px;

    opacity: 0;

    transition:
        opacity .25s ease,
        transform .25s ease;

    pointer-events: none;

    backdrop-filter: blur(5px);
}

.fish:hover .fish-name {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================================
   SWIMMING
========================================================= */

.fish.left {

    animation:
        swimLeft
        var(--duration)
        linear
        infinite;

    animation-delay:
        var(--delay);
}

.fish.right {

    animation:
        swimRight
        var(--duration)
        linear
        infinite;

    animation-delay:
        var(--delay);
}

@keyframes swimLeft {

    from {

        transform:
            translateX(110vw)
            translateY(var(--y));
    }

    to {

        transform:
            translateX(-150px)
            translateY(
                calc(
                    var(--y) +
                    var(--drift)
                )
            );
    }
}

@keyframes swimRight {

    from {

        transform:
            translateX(-150px)
            translateY(var(--y))
            scaleX(-1);
    }

    to {

        transform:
            translateX(110vw)
            translateY(
                calc(
                    var(--y) +
                    var(--drift)
                )
            )
            scaleX(-1);
    }
}

/* =========================================================
   DHARI
========================================================= */

.fish.dhari {

    width: 82px;

    height: 58px;

    z-index: 50;

    filter:
        drop-shadow(
            0 0 5px
            rgba(255,160,200,.5)
        )
        drop-shadow(
            0 0 18px
            rgba(255,80,150,.25)
        );
}

.heart-body {

    position: absolute;

    left: 15px;

    top: 8px;

    width: 34px;

    height: 34px;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,240,245,.8),
            rgba(255,170,205,.65),
            rgba(235,70,125,.45)
        );

    border-radius:
        50% 50% 50% 8%;

    transform:
        rotate(-45deg);

    opacity: .72;

    box-shadow:
        0 0 7px
        rgba(255,160,200,.6),

        0 0 18px
        rgba(255,90,150,.35);

    animation:
        dhariPulse
        3s
        ease-in-out
        infinite;
}

.heart-body::before,
.heart-body::after {

    content: "";

    position: absolute;

    width: 34px;

    height: 34px;

    background: inherit;

    border-radius: 50%;

    box-shadow: inherit;
}

.heart-body::before {

    left: 0;

    top: -17px;
}

.heart-body::after {

    left: 17px;

    top: 0;
}

.heart-tail {

    position: absolute;

    right: 1px;

    top: 20px;

    width: 27px;

    height: 20px;

    background:
        rgba(255,140,180,.5);

    clip-path:
        polygon(
            0 50%,
            100% 0,
            82% 50%,
            100% 100%
        );

    animation:
        tailMove
        .7s
        ease-in-out
        infinite alternate;
}

.heart-eye {

    position: absolute;

    left: 46px;

    top: 21px;

    width: 4px;

    height: 4px;

    background:
        rgba(40,10,25,.7);

    border-radius: 50%;
}

.heart-shine {

    position: absolute;

    left: 23px;

    top: 13px;

    width: 8px;

    height: 4px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.55);

    transform:
        rotate(-35deg);
}

@keyframes dhariPulse {

    0%,
    100% {

        transform:
            rotate(-45deg)
            scale(.94);

        opacity: .55;
    }

    50% {

        transform:
            rotate(-45deg)
            scale(1.05);

        opacity: .78;
    }
}

@keyframes tailMove {

    from {
        transform: rotate(-8deg);
    }

    to {
        transform: rotate(8deg);
    }
}

/* =========================================================
   SEABED
========================================================= */

.seabed {

    position: absolute;

    bottom: -5px;

    left: -5%;

    width: 110%;

    height: 80px;

    border-radius:
        50% 50% 0 0;

    background:
        linear-gradient(
            to bottom,
            #44322a,
            #181218
        );

    z-index: 12;

    opacity: .8;
}

/* =========================================================
   SEAWEED
========================================================= */

.seaweed {

    position: absolute;

    bottom: 30px;

    width: 5px;

    border-radius: 10px;

    background:
        linear-gradient(
            to right,
            #143c39,
            #2d786c,
            #123632
        );

    transform-origin: bottom;

    animation:
        weedMove
        4s
        ease-in-out
        infinite alternate;

    z-index: 13;
}

@keyframes weedMove {

    from {
        transform: rotate(-6deg);
    }

    to {
        transform: rotate(7deg);
    }
}

/* =========================================================
   CORAL
========================================================= */

.coral {

    position: absolute;

    bottom: 28px;

    width: 80px;

    height: 80px;

    z-index: 14;
}

.coral span {

    position: absolute;

    bottom: 0;

    width: 10px;

    border-radius: 10px;

    background:
        linear-gradient(
            to right,
            #613246,
            #a85b72,
            #643347
        );

    transform-origin: bottom;

    animation:
        coralMove
        3s
        ease-in-out
        infinite alternate;
}

@keyframes coralMove {

    from {
        transform: rotate(-5deg);
    }

    to {
        transform: rotate(6deg);
    }
}

/* =========================================================
   ❤️ LOVE SCREEN
========================================================= */

#loveScreen {

    position: fixed;

    inset: 0;

    z-index: 500;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 1s ease,
        visibility 1s ease;

    background:
        radial-gradient(
            circle at 50% 43%,
            rgba(255,80,150,.10),
            transparent 38%
        );
}

#loveScreen.show {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}

/* =========================================================
   BIG FISH HEART
========================================================= */

#fishHeart {

    position: absolute;

    left: 50%;

    top: 46%;

    transform:
        translate(-50%,-50%);

    width:
        min(82vw, 620px);

    height:
        min(68vh, 560px);

    display: flex;

    align-items: center;

    justify-content: center;
}

/* heart grid */

.heart-grid {

    position: relative;

    width: 100%;

    height: 100%;
}

/* =========================================================
   INDIVIDUAL HEART FISH
========================================================= */

.heart-fish {

    position: absolute;

    width: 28px;

    height: 18px;

    opacity: 0;

    transform:
        translate(-50%,-50%)
        scale(.1);

    transition:
        opacity .65s ease,
        transform .8s
        cubic-bezier(.2,.8,.2,1);

    filter:
        drop-shadow(
            0 0 5px
            rgba(100,220,255,.55)
        );
}

#loveScreen.show .heart-fish {

    opacity: .92;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.heart-fish svg {

    width: 100%;

    height: 100%;

    overflow: visible;
}

/* subtle swimming */

.heart-fish-inner {

    animation:
        heartFishSwim
        var(--fish-speed)
        ease-in-out
        infinite alternate;
}

@keyframes heartFishSwim {

    from {
        transform:
            translateY(-2px)
            rotate(-3deg);
    }

    to {
        transform:
            translateY(2px)
            rotate(3deg);
    }
}

/* =========================================================
   HEART GLOW
========================================================= */

.heart-glow {

    position: absolute;

    left: 50%;

    top: 46%;

    transform:
        translate(-50%,-50%);

    width:
        min(55vw, 420px);

    height:
        min(50vh, 400px);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,100,160,.13),
            transparent 65%
        );

    filter: blur(25px);

    pointer-events: none;

    animation:
        heartGlow
        3s
        ease-in-out
        infinite;
}

@keyframes heartGlow {

    0%,
    100% {
        transform:
            translate(-50%,-50%)
            scale(.92);
    }

    50% {
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }
}

/* =========================================================
   LOVE TEXT
========================================================= */

.love-text {

    position: absolute;

    left: 50%;

    bottom: 11%;

    transform:
        translateX(-50%)
        translateY(15px);

    text-align: center;

    opacity: 0;

    transition:
        opacity 1s ease 1.2s,
        transform 1s ease 1.2s;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(28px, 6vw, 46px);

    white-space: nowrap;

    color:
        rgba(255,235,245,.94);

    text-shadow:
        0 0 12px
        rgba(255,120,170,.55);
}

#loveScreen.show .love-text {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

.love-subtext {

    display: block;

    margin-top: 4px;

    font-family: Inter, sans-serif;

    font-size: 9px;

    letter-spacing: .18em;

    text-transform: uppercase;

    color:
        rgba(220,245,255,.48);
}

/* =========================================================
   BACK
========================================================= */

.back-button {

    position: absolute;

    left: 50%;

    bottom: 3.5%;

    transform:
        translateX(-50%);

    padding:
        9px 19px;

    border:
        1px solid
        rgba(255,170,200,.25);

    border-radius: 999px;

    background:
        rgba(255,100,155,.07);

    color:
        rgba(255,225,238,.7);

    font-family: Inter, sans-serif;

    font-size: 9px;

    letter-spacing: .14em;

    cursor: pointer;

    opacity: 0;

    transition:
        opacity .8s ease 1.5s,
        background .3s ease;
}

#loveScreen.show .back-button {
    opacity: 1;
}

.back-button:hover {

    background:
        rgba(255,100,155,.16);

    color: white;
}

/* =========================================================
   FLOATING HEARTS
========================================================= */

.float-heart {

    position: fixed;

    z-index: 700;

    pointer-events: none;

    color:
        rgba(255,130,175,.7);

    font-size:
        var(--size);

    animation:
        floatHeart
        3s
        ease-out
        forwards;

    text-shadow:
        0 0 10px
        rgba(255,100,160,.55);
}

@keyframes floatHeart {

    0% {

        opacity: 0;

        transform:
            translateY(0)
            scale(.5);
    }

    15% {
        opacity: .8;
    }

    100% {

        opacity: 0;

        transform:
            translateY(-180px)
            translateX(var(--move))
            scale(1.1);
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .header {
        top: 18px;
    }

    .header h1 {
        font-size: 40px;
    }

    .header p {
        font-size: 8px;
    }

    .fish {
        width: 50px;
        height: 32px;
    }

    .fish.dhari {
        width: 72px;
        height: 52px;
    }

    #fishHeart {

        width: 94vw;

        height: 58vh;

        top: 43%;
    }

    .heart-fish {

        width: 18px;

        height: 12px;
    }

    .love-text {

        bottom: 11%;

        font-size: 29px;
    }

    .back-button {

        bottom: 3%;

        font-size: 8px;
    }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;
    }
}

</style>
</head>

/* =========================================================
   HEART SHAPE
=========================================================

   This is deliberately made from a FIXED GRID.

   #   #     #   #
   ### ### ### ###
   ###############
    #############
     ###########
       #######
        #####
         ###
          #

   So there is no mathematical equation
   that can fail to render.
========================================================= */

const heartPattern = [

    "     111111     111111     ",

    "   1111111111  1111111111   ",

    "  111111111111111111111111  ",

    " 11111111111111111111111111 ",

    "1111111111111111111111111111",

    "1111111111111111111111111111",

    "1111111111111111111111111111",

    " 11111111111111111111111111 ",

    "  111111111111111111111111  ",

    "   1111111111111111111111   ",

    "    11111111111111111111    ",

    "      1111111111111111      ",

    "        111111111111        ",

    "         1111111111         ",

    "          11111111          ",

    "           111111           ",

    "            1111            ",

    "             11             "

];


/* =========================================================
   CREATE HEART FISH
========================================================= */

function createFishHeart() {

    heartGrid.innerHTML = "";

    const rows =
        heartPattern.length;

    const cols =
        heartPattern[0].length;

    const gridWidth =
        heartGrid.clientWidth;

    const gridHeight =
        heartGrid.clientHeight;


    /*
       Responsive fish size
    */

    let fishWidth;

    if (
        window.innerWidth <= 600
    ) {

        fishWidth = 14;

    } else if (
        window.innerWidth <= 900
    ) {

        fishWidth = 20;

    } else {

        fishWidth = 25;

    }


    /*
       Calculate spacing.
    */

    const xSpacing =
        Math.min(
            fishWidth + 2,
            gridWidth / cols
        );

    const ySpacing =
        Math.min(
            fishWidth * .85,
            gridHeight / rows
        );


    /*
       Center the heart.
    */

    const actualWidth =
        cols * xSpacing;

    const actualHeight =
        rows * ySpacing;

    const startX =
        (gridWidth -
            actualWidth) / 2;

    const startY =
        (gridHeight -
            actualHeight) / 2;


    let counter = 0;


    /*
       Read every cell.
    */

    heartPattern.forEach(
        (row, rowIndex) => {

            [...row].forEach(
                (cell, columnIndex) => {

                    if (
                        cell !== "1"
                    ) {
                        return;
                    }


                    const fish =
                        document.createElement(
                            "div"
                        );

                    fish.className =
                        "heart-fish";


                    /*
                       Pick fish color.
                    */

                    const color =
                        fishColors[
                            counter %
                            fishColors.length
                        ];


                    /*
                       Pick SVG.
                    */

                    let svg =
                        fishSVGs[
                            counter %
                            fishSVGs.length
                        ];


                    svg =
                        svg.replaceAll(
                            "COLOR",
                            color
                        );


                    fish.innerHTML = `

                        <div
                            class="heart-fish-inner"
                        >

                            ${svg}

                        </div>

                    `;


                    /*
                       Position.
                    */

                    const x =
                        startX +
                        columnIndex *
                        xSpacing +
                        xSpacing / 2;

                    const y =
                        startY +
                        rowIndex *
                        ySpacing +
                        ySpacing / 2;


                    fish.style.left =
                        x + "px";

                    fish.style.top =
                        y + "px";


                    /*
                       Every fish gets
                       slightly different movement.
                    */

                    fish.style.setProperty(
                        "--fish-speed",
                        random(1.5,3.2) + "s"
                    );


                    /*
                       Different entrance delays.
                    */

                    fish.style.transitionDelay =
                        (
                            counter *
                            .018
                        ) + "s";


                    /*
                       Slight rotations.
                    */

                    fish.querySelector(
                        ".heart-fish-inner"
                    ).style.transform =
                        `rotate(
                            ${random(-8,8)}deg
                        )`;


                    heartGrid.appendChild(
                        fish
                    );


                    counter++;

                }
            );

        }
    );
}

function floatingHearts() {

}


/* =========================================================
   REVEAL
========================================================= */

let revealed = false;

function revealDhari() {

    if (revealed) {
        return;
    }

    revealed = true;


    /*
       Enter love mode.
    */

    document.body.classList.add(
        "love-mode"
    );

    hint.classList.add(
        "hide"
    );


    /*
       Stop all reef fish.
    */

    document
        .querySelectorAll(
            "#reef .fish"
        )
        .forEach(
            fish => {

                fish.style.animationPlayState =
                    "paused";

            }
        );


    /*
       Fade normal fish.
    */

    document
        .querySelectorAll(
            "#reef .fish:not(.dhari)"
        )
        .forEach(
            (fish, index) => {

                setTimeout(
                    () => {

                        fish.style.opacity =
                            "0";

                    },
                    index * 3
                );

            }
        );


    /*
       Fade Dhari.
    */

    setTimeout(
        () => {

            dhari.style.opacity =
                "0";

        },
        300
    );


    /*
       IMPORTANT:
       Build the heart AFTER
       the container exists.
    */

    createFishHeart();


    /*
       Show love screen.
    */

    setTimeout(
        () => {

            loveScreen.classList.add(
                "show"
            );

            floatingHearts();

        },
        350
    );
}

   CLICK DHARI
========================================================= */

dhari.addEventListener(
    "click",
    revealDhari
);


/* =========================================================
   BACK TO REEF
========================================================= */

function backToReef() {

    loveScreen.classList.remove(
        "show"
    );


    setTimeout(
        () => {

            document.body.classList.remove(
                "love-mode"
            );

            /*
               Restore fish.
            */

            document
                .querySelectorAll(
                    "#reef .fish"
                )
                .forEach(
                    fish => {

                        fish.style.opacity =
                            "";

                        fish.style.animationPlayState =
                            "running";

                    }
                );


            dhari.style.opacity =
                "";


            hint.classList.remove(
                "hide"
            );


            revealed = false;

        },
        800
    );
}

backButton.addEventListener(
    "click",
    backToReef
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            revealed
        ) {

            backToReef();

        }

    }
);

   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        if (revealed) {

            createFishHeart();

        }

    }
);
