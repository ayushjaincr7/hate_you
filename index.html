<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>For Dhari</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500&family=Playfair+Display:wght@500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --cream: #f5ead6;
            --wine: #5a1427;
            --pink: #e8a3b5;
            --moss: #6f8b5e;
            --gold: #e3b04b;
            --c: min(26vh, 19vw);
            --sx: 56vw;
            --sb: 11%
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html,
        body {
            height: 100%;
            background: #0b0506;
            overflow: hidden;
            font-family: 'Cormorant Garamond', Georgia, serif;
            color: var(--cream)
        }

        #st {
            position: fixed;
            inset: 0;
            overflow: hidden
        }

        #w {
            position: absolute;
            inset: 0;
            transform-origin: 0 0;
            transition: transform 4s cubic-bezier(.45, 0, .25, 1)
        }

        #w>*,
        #w i {
            position: absolute
        }

        .room {
            transition: opacity 8s
        }

        #wall {
            inset: -9% -9% 27% -9%;
            background: radial-gradient(ellipse 60% 70% at 25% 35%, #5a2c1b, #2b1311 65%, #170b0c)
        }

        #floor {
            inset: 72% -9% -9% -9%;
            background: repeating-linear-gradient(95deg, #3b2113 0 64px, #2a170c 64px 66px)
        }

        #rug {
            left: 44%;
            top: 79%;
            width: 38%;
            height: 17%;
            border-radius: 50%;
            background: radial-gradient(ellipse, #6b1f30 40%, #4a1422 41% 78%, #c9a36a 79% 82%, #4a1422 83%)
        }

        #win {
            left: 56%;
            top: 6%;
            width: 17%;
            height: 38%;
            border: 1.1vmin solid #4a2a18;
            background: radial-gradient(circle at 68% 28%, #fff6d8 0 2.5%, #dfe7f7 3.5%, transparent 14%), #1b2a45
        }

        #win:before,
        #win:after {
            content: "";
            position: absolute;
            background: #4a2a18
        }

        #win:before {
            left: 48%;
            top: 0;
            bottom: 0;
            width: 1vmin
        }

        #win:after {
            top: 50%;
            left: 0;
            right: 0;
            height: 1vmin
        }

        #beam {
            left: 54%;
            top: 12%;
            width: 26%;
            height: 64%;
            clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%);
            background: rgba(190, 208, 255, .1);
            transition: background 8s
        }

        .tr #beam {
            background: rgba(255, 214, 140, .28)
        }

        #fy {
            left: 2%;
            top: 1%;
            width: 96%;
            height: 5%;
            border-bottom: 1px solid rgba(255, 226, 160, .25);
            border-radius: 0 0 50% 50%/0 0 100% 100%
        }

        #fy:after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, #ffe2a0 0 .3vmin, transparent .55vmin) 0 0/2.6vmin 100%;
            animation: tw2 4s infinite alternate
        }

        @keyframes tw2 {
            to {
                opacity: .45
            }
        }

        #case {
            left: 3%;
            top: 5%;
            width: 48%;
            height: 64%;
            background: #241108;
            border: 1.2vmin solid #4b2814;
            box-shadow: 0 0 5vmin #000 inset
        }

        .sh {
            height: 33.3%;
            display: flex;
            align-items: flex-end;
            gap: .5%;
            padding: 0 1.5%;
            border-bottom: 1.1vmin solid #3a1f10;
            background: #170b06
        }

        .bk {
            container-type: size;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px 2px 1px 1px;
            cursor: pointer;
            transition: translate .4s, filter 1.4s;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .4), inset 2px 0 3px rgba(255, 255, 255, .1), inset -3px 0 4px rgba(0, 0, 0, .4);
            background-image: linear-gradient(95deg, rgba(255, 255, 255, .05), transparent 30%, rgba(0, 0, 0, .18))
        }

        .bk.hc {
            background-image: linear-gradient(transparent 10%, rgba(227, 176, 75, .55) 10% 11.5%, transparent 11.5% 88%, rgba(227, 176, 75, .55) 88% 89.5%, transparent 89.5%), linear-gradient(95deg, rgba(255, 255, 255, .05), transparent 30%, rgba(0, 0, 0, .2))
        }

        .bk:hover {
            translate: 0 -6px
        }

        .bk b {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-weight: 400;
            white-space: nowrap;
            font-size: min(40cqw, calc(var(--k)*100cqh))
        }

        .dof .bk:not(.f),
        .dof .sb:not(.f) {
            filter: blur(2px) brightness(.6)
        }

        .bk.f,
        .sb.f {
            translate: 0 -1.2vmin;
            filter: drop-shadow(0 0 1.4vmin rgba(255, 214, 140, .6))
        }

        #vn {
            inset: 0;
            opacity: 0;
            transition: opacity 8s;
            pointer-events: none
        }

        .mg #vn {
            opacity: 1
        }

        #tb {
            left: 76%;
            top: 62%;
            width: 20%;
            height: 2vmin;
            background: #5a3118;
            border-radius: 3px;
            box-shadow: 0 1vmin 2vmin #000
        }

        #tb:before,
        #tb:after {
            content: "";
            position: absolute;
            top: 100%;
            width: 1.2vmin;
            height: 15vmin;
            background: #3e2210;
            left: 8%
        }

        #tb:after {
            left: auto;
            right: 8%
        }

        #bo {
            left: 78%;
            top: 60.2%;
            width: 9%;
            height: 1.8%;
            background: linear-gradient(90deg, #efe3c8 49%, #b9a982 50%, #efe3c8 51%);
            transform: skewX(-14deg)
        }

        #lp {
            left: 90%;
            top: 51%;
            width: 4.4%;
            height: 11%;
            background: linear-gradient(#e9c27a, #b8873b);
            clip-path: polygon(18% 0, 82% 0, 100% 55%, 56% 55%, 56% 90%, 76% 100%, 24% 100%, 44% 90%, 44% 55%, 0 55%)
        }

        #lg {
            left: 78%;
            top: 36%;
            width: 34%;
            height: 46%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 110, .34), transparent 65%);
            animation: fl 5s infinite alternate
        }

        @keyframes fl {
            to {
                opacity: .7
            }
        }

        #ch {
            left: 84%;
            top: 40%;
            width: 12%;
            height: 34%;
            background: #6b1f30;
            border-radius: 40% 40% 8% 8%;
            box-shadow: inset 0 0 3vmin #000;
            z-index: -1
        }

        #pl {
            left: 52.5%;
            top: 56%;
            width: 5%;
            height: 16%;
            background: radial-gradient(ellipse 90% 60% at 50% 30%, #5f8250 60%, transparent 62%) top/100% 70% no-repeat, linear-gradient(#a8643e, #7c4328) bottom/70% 30% no-repeat
        }

        #g {
            inset: -9%;
            opacity: 0;
            transition: opacity 9s;
            background: radial-gradient(circle at 66% 14%, rgba(255, 228, 160, .9), transparent 22%), radial-gradient(ellipse 90% 30% at 30% 62%, #a9bf93 60%, transparent 61%), radial-gradient(ellipse 100% 34% at 75% 66%, #8fae7d 60%, transparent 61%), linear-gradient(#f9e5d5, #f4d2da 45%, #cfdcae 46%, #7f9f6e)
        }

        .tr #g {
            opacity: 1
        }

        #path {
            left: 30%;
            top: 80%;
            width: 52%;
            height: 18%;
            border-radius: 50%;
            background: radial-gradient(ellipse, #e9d3b0, #d8b98c);
            opacity: 0;
            transition: opacity 6s 3s
        }

        .gd #path {
            opacity: .9
        }

        #sun {
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 66% 12%, rgba(255, 214, 140, .45), transparent 50%);
            mix-blend-mode: screen;
            opacity: 0;
            transition: opacity 8s
        }

        .tr #sun {
            opacity: 1
        }

        #fl {
            inset: -9%;
            z-index: 4;
            pointer-events: none
        }

        .fl {
            position: absolute;
            pointer-events: auto;
            translate: -50% -100%;
            scale: 0;
            transform-origin: 50% 100%;
            transition: scale 2.6s cubic-bezier(.2, 1.2, .4, 1);
            cursor: pointer
        }

        .gd .fl {
            scale: 1
        }

        .fl svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            transform-origin: 50% 100%;
            animation: sw 4s ease-in-out infinite alternate
        }

        @keyframes sw {
            from {
                rotate: -2.5deg
            }

            to {
                rotate: 2.5deg
            }
        }

        .vi {
            width: 1px;
            background: rgba(95, 130, 80, .7);
            top: -9%;
            z-index: 3
        }

        #cs {
            left: var(--sx);
            bottom: var(--sb);
            width: var(--c);
            height: calc(var(--c)*1.45);
            z-index: 5
        }

        #cs>* {
            position: absolute
        }

        #stk {
            left: 8%;
            bottom: 0;
            width: 84%;
            height: calc(var(--c)*.4);
            display: flex;
            flex-direction: column-reverse
        }

        .sb {
            flex: 1;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--c)*.062);
            cursor: pointer;
            border-radius: 2px;
            box-shadow: inset 0 -2px 3px rgba(0, 0, 0, .4), 0 1px 2px #000;
            transition: filter 1.4s;
            container-type: normal
        }

        .nt {
            right: 1%;
            bottom: 4%;
            width: calc(var(--c)*.1);
            height: calc(var(--c)*.06);
            background: #f3e6c7;
            rotate: 8deg;
            transform-origin: 0 100%;
            transition: transform .5s;
            overflow: hidden;
            font: 500 calc(var(--c)*.011)/1.15 Caveat, cursive;
            color: #5a1427;
            padding: 1px;
            z-index: 2;
            cursor: pointer;
            box-shadow: 0 1px 3px #0008
        }

        .nt:hover,
        .nt.o {
            transform: scale(3.4)
        }

        #cat {
            left: 0;
            bottom: 0;
            width: 100%;
            transition: transform 1s linear;
            opacity: 0;
            z-index: 3
        }

        #cat.on {
            opacity: 1
        }

        #cat svg {
            width: 100%;
            display: block;
            overflow: visible;
            cursor: pointer
        }

        #cat.gl {
            filter: drop-shadow(0 0 1.6vmin rgba(255, 206, 130, .55))
        }

        #cs svg g,
        #cw * {
            transform-box: fill-box
        }

        #sit {
            display: none
        }

        #cat.sit #sit {
            display: block
        }

        #cat.sit #wlk {
            display: none
        }

        .ey {
            transform-origin: center;
            animation: bl 5s infinite
        }

        @keyframes bl {

            0%,
            93%,
            100% {
                scale: 1
            }

            96% {
                scale: 1 .1
            }
        }

        .er {
            transform-origin: 50% 100%;
            animation: ew 7s infinite
        }

        @keyframes ew {

            0%,
            90%,
            100% {
                rotate: 0deg
            }

            93% {
                rotate: -9deg
            }

            96% {
                rotate: 6deg
            }
        }

        .tl {
            transform-origin: 20% 90%;
            animation: ta 3.6s ease-in-out infinite alternate
        }

        @keyframes ta {
            from {
                rotate: -6deg
            }

            to {
                rotate: 7deg
            }
        }

        .br {
            transform-origin: 50% 100%;
            animation: br 4s ease-in-out infinite alternate
        }

        @keyframes br {
            to {
                scale: 1 1.025
            }
        }

        .hd {
            transform-origin: 50% 100%;
            animation: hh 9s ease-in-out infinite
        }

        @keyframes hh {

            0%,
            100% {
                rotate: 0deg
            }

            30% {
                rotate: -4deg
            }

            60% {
                rotate: 5deg
            }
        }

        .l1,
        .l4,
        .l2,
        .l3 {
            transform-origin: 50% 0
        }

        .wk .l1,
        .wk .l4 {
            animation: lg .45s infinite alternate
        }

        .wk .l2,
        .wk .l3 {
            animation: lg .45s infinite alternate-reverse
        }

        @keyframes lg {
            from {
                rotate: -20deg
            }

            to {
                rotate: 20deg
            }
        }

        .wk #cw {
            animation: bob .45s infinite alternate
        }

        @keyframes bob {
            to {
                translate: 0 -3px
            }
        }

        .lk #wlk .hd {
            animation: none;
            rotate: -14deg
        }

        .lc #wlk .hd {
            animation: none;
            scale: 1.12
        }

        .sn #wlk .hd {
            animation: sn 1.1s 2 ease-in-out
        }

        @keyframes sn {
            50% {
                rotate: 16deg;
                translate: 4px 8px
            }
        }

        .pw #wlk {
            rotate: -14deg;
            transform-origin: 80% 100%
        }

        .pet .tl {
            animation-duration: .6s
        }

        .pet .er {
            animation-duration: 1s
        }

        .pet .ey {
            animation: bl 1.4s 1
        }

        .cl #sit {
            transform: scale(1, .82);
            transform-origin: 50% 100%;
            transition: transform 3s
        }

        .tn #sit {
            animation: tn 2s
        }

        @keyframes tn {
            50% {
                transform: scaleX(-1)
            }
        }

        .str #sit {
            animation: ss 2.4s
        }

        @keyframes ss {
            40% {
                transform: scale(1.06, .9) translateY(4px)
            }

            70% {
                transform: scale(.97, 1.07)
            }
        }

        #pc {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            pointer-events: none
        }

        #st:before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 40;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 45%, rgba(8, 3, 4, .6));
            transition: opacity 8s
        }

        .gd:before {
            opacity: .25
        }

        #bk {
            position: absolute;
            inset: 0;
            background: #0b0506;
            z-index: 50;
            transition: opacity 4s;
            pointer-events: none
        }

        .in #bk {
            opacity: 0
        }

        #cap {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 7%;
            text-align: center;
            font: 500 clamp(22px, 4vmin, 40px) Caveat, cursive;
            z-index: 46;
            opacity: 0;
            transition: opacity 1s;
            pointer-events: none;
            text-shadow: 0 0 12px #000
        }

        #cap.on {
            opacity: 1
        }

        #tx {
            position: absolute;
            left: 0;
            right: 0;
            top: 4%;
            text-align: center;
            z-index: 45;
            color: var(--wine);
            pointer-events: none;
            padding: 0 5%;
            text-shadow: 0 0 14px #fff8, 0 0 30px rgba(255, 235, 190, .8)
        }

        #tx h1 {
            font: 500 clamp(34px, 7.5vmin, 86px)/1.1 Caveat, cursive;
            font-weight: 500
        }

        #tx h1 span {
            display: inline-block;
            clip-path: inset(0 100% 0 0);
            padding: 0 .1em .1em 0
        }

        #tx h1 span.on {
            clip-path: inset(0);
            transition: clip-path 2.8s steps(26)
        }

        #t3 {
            font-size: clamp(15px, 2.3vmin, 24px);
            font-style: italic;
            opacity: 0;
            transition: opacity 3s
        }

        #t3.on {
            opacity: 1
        }

        #ms {
            margin-top: 2.4vmin;
            min-height: 18vmin;
            font-size: clamp(17px, 3.1vmin, 32px);
            line-height: 1.5;
            font-style: italic
        }

        #ms p {
            opacity: 0;
            transition: opacity 2.4s
        }

        #ms.on p {
            opacity: 1
        }

        #ms small {
            font-size: .62em
        }

        #tp {
            position: fixed;
            z-index: 70;
            pointer-events: none;
            background: rgba(30, 12, 16, .88);
            color: var(--cream);
            padding: .3em .7em;
            border-radius: 4px;
            font-size: 15px;
            opacity: 0;
            transition: opacity .2s;
            white-space: nowrap
        }

        #cd {
            position: fixed;
            left: 50%;
            top: 50%;
            translate: -50% -50%;
            z-index: 71;
            background: var(--cream);
            color: var(--wine);
            padding: 1.4em 2em;
            border-radius: 3px;
            text-align: center;
            font-style: italic;
            font-size: 21px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .5s;
            box-shadow: 0 0 40px #000a
        }

        #cd.on {
            opacity: 1
        }

        #cd small {
            display: block;
            font: 500 17px Caveat;
            margin-top: .4em;
            opacity: .7
        }

        .ct {
            position: fixed;
            z-index: 60;
            top: calc(12px + env(safe-area-inset-top, 0px));
            right: 14px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(245, 234, 214, .4);
            background: rgba(20, 8, 10, .5);
            color: var(--cream);
            font-size: 17px;
            cursor: pointer
        }

        #rp {
            top: auto;
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            right: auto;
            left: 50%;
            translate: -50% 0;
            width: auto;
            height: auto;
            padding: .4em 1.2em;
            border-radius: 20px;
            font: italic 17px 'Cormorant Garamond';
            opacity: 0;
            pointer-events: none;
            transition: opacity 3s;
            color: var(--wine);
            background: rgba(255, 246, 230, .6);
            border-color: rgba(90, 20, 39, .4)
        }

        .end #rp {
            opacity: 1;
            pointer-events: auto
        }

        @media (max-aspect-ratio:4/5) {
            :root {
                --c: 46vw;
                --sx: 27vw;
                --sb: 15%
            }

            #win {
                left: 30%;
                top: 1.5%;
                width: 40%;
                height: 15%
            }

            #beam {
                left: 20%;
                width: 60%;
                top: 8%;
                height: 50%
            }

            #case {
                left: 3%;
                top: 19%;
                width: 94%;
                height: 42%
            }

            #tb {
                left: 56%;
                top: 68%;
                width: 40%
            }

            #bo {
                left: 60%;
                top: 66.2%;
                width: 18%
            }

            #lp {
                left: 84%;
                top: 57%;
                width: 9%
            }

            #lg {
                left: 55%;
                top: 48%
            }

            #ch {
                left: 72%;
                top: 52%;
                width: 24%;
                height: 32%
            }

            #pl {
                left: 4%;
                top: 62%;
                width: 9%;
                height: 11%
            }

            #rug {
                left: 6%;
                top: 84%;
                width: 88%
            }
        }

        @media (prefers-reduced-motion:reduce) {

            .fl svg,
            .tl,
            .hd {
                animation: none
            }
        }
    </style>
</head>

<body>
    <div id="st">
        <div id="w">
            <div id="wall" class="room"></div>
            <div id="floor" class="room"></div>
            <div id="rug" class="room"></div>
            <div id="win" class="room"></div>
            <div id="beam" class="room"></div>
            <div id="fy" class="room"></div>
            <div id="ch" class="room"></div>
            <div id="tb" class="room"></div>
            <div id="bo" class="room"></div>
            <div id="lp" class="room"></div>
            <div id="lg" class="room"></div>
            <div id="pl" class="room"></div>
            <div id="g"><i id="path"></i></div>
            <div id="case" class="room">
                <div id="vn"></div>
            </div>
            <div id="fl"></div>
            <div id="sun"></div>
            <div id="cs">
                <div id="stk"></div>
                <div class="nt" data-t="A small note" id="nt">“I wanted to build you a little world from the things you
                    love.”</div>
                <div id="cat"><svg viewBox="0 0 200 200">
                        <defs>
                            <filter id="fz" x="-5%" y="-5%" width="110%" height="110%">
                                <feTurbulence baseFrequency=".8" numOctaves="2" result="n" />
                                <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" />
                            </filter>
                        </defs>
                        <g id="wlk" filter="url(#fz)">
                            <g id="cw" style="transform-origin:100px 100px">
                                <path class="tl" d="M36 140C6 135 4 96 26 86" stroke="#d3995e" stroke-width="15"
                                    fill="none" stroke-linecap="round" />
                                <rect class="l1" x="46" y="150" width="13" height="46" rx="6" fill="#c98e55" />
                                <rect class="l2" x="64" y="150" width="13" height="46" rx="6" fill="#d9a46c" />
                                <rect class="l3" x="102" y="150" width="13" height="46" rx="6" fill="#c98e55" />
                                <rect class="l4" x="120" y="150" width="13" height="46" rx="6" fill="#d9a46c" />
                                <ellipse cx="86" cy="140" rx="54" ry="30" fill="#e0b07a" />
                                <ellipse cx="96" cy="158" rx="34" ry="12" fill="#f6e3c4" />
                                <g class="hd">
                                    <circle cx="150" cy="114" r="27" fill="#e5b883" />
                                    <path class="er" d="M131 98L128 70L152 88Z" fill="#d3995e" />
                                    <path class="er" d="M158 88L178 70L176 100Z" fill="#d3995e" />
                                    <ellipse class="ey" cx="160" cy="112" rx="4" ry="5.5" fill="#2b1a10" />
                                    <ellipse cx="171" cy="122" rx="4" ry="3" fill="#e58f9b" />
                                </g>
                            </g>
                        </g>
                        <g id="sit" filter="url(#fz)">
                            <g class="br">
                                <path class="tl" d="M146 178C192 178 196 128 166 122" stroke="#d3995e" stroke-width="15"
                                    fill="none" stroke-linecap="round" />
