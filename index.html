<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#021522">

<title>The Reef — For Dhari 🐠❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:"Quicksand",sans-serif;

    background:
        radial-gradient(
            ellipse at 50% -10%,
            rgba(100,225,255,.20),
            transparent 42%
        ),
        linear-gradient(
            180deg,
            #01121e 0%,
            #022d42 35%,
            #04596d 68%,
            #087f88 100%
        );

    color:white;
}


/* =========================================================
   OCEAN LIGHT
========================================================= */

.ocean-light{
    position:fixed;
    inset:-40%;

    z-index:1;
    pointer-events:none;

    background:
        linear-gradient(
            105deg,
            transparent 20%,
            rgba(255,255,255,.055) 42%,
            transparent 55%
        ),
        linear-gradient(
            75deg,
            transparent 38%,
            rgba(120,240,255,.045) 51%,
            transparent 65%
        );

    filter:blur(20px);

    animation:
        oceanLight
        13s
        ease-in-out
        infinite
        alternate;
}

@keyframes oceanLight{

    from{
        transform:
            translateX(-5%)
            rotate(-2deg);
    }

    to{
        transform:
            translateX(5%)
            rotate(2deg);
    }

}


/* =========================================================
   TOP MESSAGE
========================================================= */

.top-message{

    position:fixed;

    z-index:100;

    top:23px;
    left:50%;

    width:92%;

    transform:
        translateX(-50%);

    text-align:center;

    color:
        rgba(255,255,255,.73);

    font-size:
        clamp(.7rem,1.5vw,.95rem);

    letter-spacing:.07em;

    text-shadow:
        0 2px 12px rgba(0,0,0,.65);

    pointer-events:none;
}


/* =========================================================
   PARTICLES
========================================================= */

.particles{

    position:fixed;
    inset:0;

    z-index:4;

    pointer-events:none;
}

.particle{

    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:
        rgba(180,245,255,.7);

    box-shadow:
        0 0 8px
        rgba(100,230,255,.7);

    animation:
        particleFloat
        ease-in-out
        infinite
        alternate;
}

@keyframes particleFloat{

    from{
        opacity:.15;

        transform:
            translateY(8px)
            scale(.7);
    }

    to{
        opacity:.8;

        transform:
            translateY(-15px)
            scale(1.3);
    }

}


/* =========================================================
   BUBBLES
========================================================= */

.bubbles{

    position:fixed;
    inset:0;

    z-index:5;

    overflow:hidden;

    pointer-events:none;
}

.bubble{

    position:absolute;

    bottom:-40px;

    border:
        1px solid
        rgba(255,255,255,.35);

    border-radius:50%;

    background:
        rgba(255,255,255,.035);

    box-shadow:
        inset 2px 2px 4px
        rgba(255,255,255,.2),
        0 0 8px
        rgba(255,255,255,.08);

    animation:
        bubbleRise
        linear
        infinite;
}

@keyframes bubbleRise{

    0%{
        transform:
            translate(0,0)
            scale(.6);

        opacity:0;
    }

    12%{
        opacity:.7;
    }

    50%{
        transform:
            translate(15px,-55vh)
            scale(1);
    }

    100%{
        transform:
            translate(-12px,-120vh)
            scale(1.15);

        opacity:0;
    }

}


/* =========================================================
   REEF
========================================================= */

.reef{

    position:fixed;

    inset:0;

    z-index:20;

    overflow:hidden;
}


/* =========================================================
   FISH
========================================================= */

.fish{

    position:absolute;

    left:0;
    top:var(--top);

    width:var(--size);
    height:var(--size);

    border:0;

    padding:0;

    background:none;

    color:var(--color);

    cursor:pointer;

    pointer-events:auto;

    opacity:var(--opacity);

    animation:
        swimLeft
        var(--duration)
        linear
        var(--delay)
        infinite;

    will-change:transform;

    -webkit-tap-highlight-color:transparent;
}

.fish.right{
    animation-name:swimRight;
}

.fish svg{

    width:100%;
    height:100%;

    overflow:visible;

    filter:
        drop-shadow(
            0 3px 5px
            rgba(0,0,0,.25)
        );

    transition:
        transform .2s ease;
}

.fish:hover svg{

    transform:
        scale(1.08);
}


/* =========================================================
   FISH MOVEMENT
========================================================= */

@keyframes swimLeft{

    0%{
        transform:
            translateX(115vw)
            translateY(0)
            rotate(0deg);
    }

    20%{
        transform:
            translateX(80vw)
            translateY(var(--w1))
            rotate(-2deg);
    }

    40%{
        transform:
            translateX(55vw)
            translateY(var(--w2))
            rotate(2deg);
    }

    60%{
        transform:
            translateX(30vw)
            translateY(var(--w3))
            rotate(-2deg);
    }

    80%{
        transform:
            translateX(5vw)
            translateY(var(--w4))
            rotate(2deg);
    }

    100%{
        transform:
            translateX(-25vw)
            translateY(0)
            rotate(0deg);
    }
}

@keyframes swimRight{

    0%{
        transform:
            translateX(-25vw)
            translateY(0)
            rotate(0deg);
    }

    20%{
        transform:
            translateX(5vw)
            translateY(var(--w1))
            rotate(2deg);
    }

    40%{
        transform:
            translateX(30vw)
            translateY(var(--w2))
            rotate(-2deg);
    }

    60%{
        transform:
            translateX(55vw)
            translateY(var(--w3))
            rotate(2deg);
    }

    80%{
        transform:
            translateX(80vw)
            translateY(var(--w4))
            rotate(-2deg);
    }

    100%{
        transform:
            translateX(115vw)
            translateY(0)
            rotate(0deg);
    }
}


/* =========================================================
   FISH NAME
========================================================= */

.fish-name{

    position:absolute;

    left:50%;
    top:-27px;

    transform:
        translateX(-50%)
        translateY(5px);

    padding:
        4px 9px;

    border-radius:999px;

    background:
        rgba(1,15,25,.84);

    border:
        1px solid
        rgba(255,255,255,.12);

    color:
        rgba(255,255,255,.92);

    font-size:9px;

    font-weight:700;

    letter-spacing:.04em;

    white-space:nowrap;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s ease,
        transform .25s ease;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.25);
}

.fish:hover .fish-name{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   DHARI
========================================================= */

.dhari{

    z-index:35;

    /*
       Slightly warm and slightly brighter
       than ordinary fish.
    */

    filter:
        drop-shadow(
            0 0 5px
            rgba(255,205,120,.28)
        );
}

.dhari-name{

    color:#ffe3a8;

    border-color:
        rgba(255,215,130,.3);
}


/* =========================================================
   DHARI SPARKLES
========================================================= */

.dhari-sparkle{

    position:absolute;

    pointer-events:none;

    color:
        rgba(255,235,180,.8);

    font-size:8px;

    opacity:0;

    text-shadow:
        0 0 7px
        rgba(255,220,150,.8);
}

.sparkle-1{

    right:15%;
    top:5%;

    animation:
        dhariSparkle
        4.8s
        ease-in-out
        infinite;
}

.sparkle-2{

    left:12%;
    top:62%;

    animation:
        dhariSparkle
        6.2s
        ease-in-out
        1.7s
        infinite;
}

.sparkle-3{

    right:28%;
    bottom:8%;

    animation:
        dhariSparkle
        5.5s
        ease-in-out
        3s
        infinite;
}

@keyframes dhariSparkle{

    0%,
    55%,
    100%{

        opacity:0;

        transform:
            scale(.3)
            rotate(0deg);
    }

    63%{

        opacity:.8;

        transform:
            scale(1)
            rotate(20deg);
    }

    70%{

        opacity:.35;

        transform:
            scale(.7)
            rotate(45deg);
    }

    76%{

        opacity:0;

        transform:
            scale(.3)
            rotate(70deg);
    }
}


/* =========================================================
   TINY DHARI HEART
========================================================= */

.dhari-hint{

    position:absolute;

    left:-5px;
    bottom:-5px;

    color:
        rgba(255,190,205,.75);

    font-size:9px;

    pointer-events:none;

    opacity:0;

    animation:
        dhariHeartHint
        7s
        ease-in-out
        infinite;
}

@keyframes dhariHeartHint{

    0%,
    64%,
    100%{

        opacity:0;

        transform:
            translateY(3px)
            scale(.4);
    }

    69%{

        opacity:.75;

        transform:
            translateY(0)
            scale(1);
    }

    74%{
        opacity:.3;
    }

    79%{
        opacity:.65;
    }

    84%{

        opacity:0;

        transform:
            translateY(-8px)
            scale(.7);
    }
}


/* =========================================================
   SEABED
========================================================= */

.seabed{

    position:fixed;

    bottom:0;
    left:0;
    right:0;

    height:18vh;

    min-height:110px;

    z-index:10;

    pointer-events:none;
}

.sand{

    position:absolute;

    inset:20% 0 0;

    background:

        radial-gradient(
            circle at 15% 40%,
            rgba(255,255,255,.12) 0 2px,
            transparent 3px
        ),

        radial-gradient(
            circle at 45% 60%,
            rgba(100,70,40,.1) 0 2px,
            transparent 3px
        ),

        radial-gradient(
            circle at 78% 35%,
            rgba(255,255,255,.12) 0 2px,
            transparent 3px
        ),

        linear-gradient(
            180deg,
            #d9bc83,
            #b8945c
        );

    border-radius:
        50% 50% 0 0 /
        20% 20% 0 0;
}


/* =========================================================
   SEAWEED
========================================================= */

.seaweed{

    position:absolute;

    bottom:5%;

    width:7px;

    border-radius:
        100% 0 100% 0;

    background:
        linear-gradient(
            180deg,
            #4ecb8b,
            #16583e
        );

    transform-origin:bottom;

    animation:
        sway
        var(--speed)
        ease-in-out
        infinite;
}

@keyframes sway{

    0%,
    100%{
        transform:rotate(-8deg);
    }

    50%{
        transform:rotate(10deg);
    }
}


/* =========================================================
   CORAL
========================================================= */

.coral{

    position:absolute;

    bottom:5%;

    width:70px;
    height:100px;
}

.coral span{

    position:absolute;

    bottom:0;

    width:14px;

    border-radius:
        50% 50% 15% 15%;

    background:
        linear-gradient(
            90deg,
            #d55c78,
            #ef919c
        );

    transform-origin:bottom;
}

.coral span:nth-child(1){

    left:2px;
    height:58px;

    transform:rotate(-18deg);
}

.coral span:nth-child(2){

    left:25px;
    height:92px;
}

.coral span:nth-child(3){

    right:3px;
    height:65px;

    transform:rotate(18deg);
}


/* =========================================================
   REVEAL
========================================================= */

.reveal{

    position:fixed;

    inset:0;

    z-index:500;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(12,87,104,.96),
            rgba(1,12,21,.995) 75%
        );

    opacity:0;

    pointer-events:none;

    transition:
        opacity .8s ease;
}

.reveal.active{

    opacity:1;

    pointer-events:auto;
}


/* =========================================================
   REVEAL GLOW
========================================================= */

.reveal-glow{

    position:absolute;

    width:80vmin;
    height:80vmin;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,194,92,.23),
            rgba(255,130,160,.07) 35%,
            transparent 70%
        );

    filter:blur(10px);

    animation:
        revealGlow
        5s
        ease-in-out
        infinite;
}

@keyframes revealGlow{

    0%,
    100%{

        transform:scale(.85);

        opacity:.6;
    }

    50%{

        transform:scale(1.12);

        opacity:1;
    }
}


/* =========================================================
   RAYS
========================================================= */

.reveal::before{

    content:"";

    position:absolute;

    inset:-50%;

    background:
        conic-gradient(
            from 0deg,
            transparent,
            rgba(255,216,145,.08),
            transparent 15%,
            rgba(255,143,169,.06),
            transparent 30%
        );

    animation:
        rotateRays
        18s
        linear
        infinite;
}

@keyframes rotateRays{

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   FORMATION
========================================================= */

.formation{

    position:absolute;

    inset:0;

    z-index:20;

    pointer-events:none;
}

.formation-fish{

    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--size);

    opacity:0;

    transform:
        translate(
            var(--fromX),
            var(--fromY)
        )
        rotate(var(--rotation))
        scale(.2);

    animation:
        formationFly
        1.45s
        cubic-bezier(.16,.8,.25,1)
        var(--delay)
        forwards;
}

.formation-fish svg{

    width:100%;
    height:auto;

    filter:
        drop-shadow(
            0 0 7px
            rgba(255,220,150,.35)
        );
}

@keyframes formationFly{

    0%{

        opacity:0;

        transform:
            translate(
                var(--fromX),
                var(--fromY)
            )
            rotate(var(--rotation))
            scale(.2);
    }

    25%{
        opacity:1;
    }

    100%{

        opacity:1;

        transform:
            translate(0,0)
            rotate(0)
            scale(1);
    }
}


/* =========================================================
   LOVE MESSAGE
========================================================= */

.love-message{

    position:absolute;

    z-index:100;

    left:50%;
    bottom:5vh;

    width:92%;

    transform:
        translate(-50%,30px);

    text-align:center;

    opacity:0;

    animation:
        messageIn
        1.2s
        ease
        4.3s
        forwards;
}

@keyframes messageIn{

    to{

        opacity:1;

        transform:
            translate(-50%,0);
    }
}

.love-title{

    font-family:
        "Caveat",
        cursive;

    font-size:
        clamp(
            3rem,
            9vw,
            6.5rem
        );

    line-height:.9;

    text-shadow:
        0 0 25px
        rgba(255,200,120,.35);
}

.love-title .pink{

    color:
        #ff91aa;
}

.love-sub{

    margin-top:12px;

    color:
        rgba(255,255,255,.72);

    font-size:
        clamp(.78rem,1.8vw,1rem);

    line-height:1.6;
}

.close{

    margin-top:18px;

    border:0;

    padding:
        11px 20px;

    border-radius:999px;

    background:
        linear-gradient(
            135deg,
            #ffd88a,
            #ffb5c5
        );

    color:#25333a;

    font-family:inherit;

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 8px 30px
        rgba(255,180,140,.2);

    transition:.25s ease;
}

.close:hover{

    transform:
        translateY(-2px)
        scale(1.03);
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.hearts{

    position:absolute;

    inset:0;

    pointer-events:none;
}

.heart{

    position:absolute;

    left:var(--left);

    bottom:-30px;

    color:#ff9eb3;

    font-size:var(--size);

    opacity:0;
}

.reveal.active .heart{

    animation:
        heartRise
        5s
        ease-in
        var(--delay)
        forwards;
}

@keyframes heartRise{

    0%{

        opacity:0;

        transform:
            translateY(0)
            rotate(0);
    }

    15%{
        opacity:.85;
    }

    100%{

        opacity:0;

        transform:
            translateY(-85vh)
            rotate(25deg);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

    .top-message{

        top:17px;

        font-size:.68rem;
    }

    .seabed{

        height:15vh;
    }

    .fish-name{

        font-size:8px;

        top:-23px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.001ms!important;

        animation-iteration-count:1!important;
    }
}

</style>
</head>

                    type + "_" + name

        );

    let name;

    if(unused.length){

            randomItem(unused);

            randomItem(names);

    usedNames.add(
        type + "_" + name

    return name;

/* =========================================================

function drawLetter(
    pattern,
    startX,
    startY,
    cellX,
    cellY,
    color,
    delay
){

    for(
        let row=0;
        row<pattern.length;
        row++
    ){

        for(
            let col=0;
            col<pattern[row].length;
            col++
        ){

            if(
                pattern[row][col] === "1"
            ){

                formationFish(

                    startX +
                    col * cellX,

                    startY +
                    row * cellY,

                    color,

                    delay +
                    (row+col)*.025

                );
            }
        }
    }
}

/* =========================================================
   FIND DHARI
========================================================= */

dhari.addEventListener(
    "click",
    ()=>{

        if(found){
            return;
        }

        found = true;

        buildFormation();

        reveal.classList.add(
            "active"
        );

        document
            .querySelectorAll(
                ".reef .fish"
            )
            .forEach(
                fish=>{
                    fish.style.animationPlayState =
                        "paused";
                }
            );
    }
);


/* =========================================================
   CLOSE
========================================================= */

close.addEventListener(
    "click",
    ()=>{

        reveal.classList.remove(
            "active"
        );

        found = false;

        document
            .querySelectorAll(
                ".reef .fish"
            )
            .forEach(
                fish=>{
                    fish.style.animationPlayState =
                        "";
                }
            );
    }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key === "Escape" &&
            found
        ){

            close.click();
        }
    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        if(!found){
            buildFormation();
        }
    }
);
